[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carrier-risk-calculator"
version = "0.2.0"
description = "Reference implementation for carrier and reproductive-risk calculations"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Andrea" }
]
dependencies = [
  "streamlit>=1.65,<2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

